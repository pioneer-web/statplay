<!doctype html>
<html lang="pt-br">

<head>

<meta charset="utf-8">

<meta
 name="viewport"
 content="width=device-width,initial-scale=1"
>

<title>
 Criar conta | StatPlay
</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;

 min-height:100vh;

 display:grid;
 place-items:center;

 padding:20px;

 background:#f5f6f8;

 color:#181c22;

 font-family:
 Roboto,
 -apple-system,
 BlinkMacSystemFont,
 "Segoe UI",
 sans-serif;
}

.box{
 width:min(
  100%,
  410px
 );

 padding:25px;

 border:
 1px solid #e4e7ec;

 border-radius:20px;

 background:#fff;

 box-shadow:
 0 10px 35px
 rgba(20,30,45,.08);
}

.logo{
 margin-bottom:5px;

 font-size:26px;
 font-weight:850;
}

.logo span{
 color:#15a46d;
}

.muted{
 margin:
 0 0 22px;

 color:#737b87;

 font-size:12px;
 line-height:1.45;
}

label{
 display:block;

 margin-top:12px;

 font-size:11px;
 font-weight:750;
}

input{
 width:100%;

 margin-top:6px;
 padding:12px;

 border:
 1px solid #e4e7ec;

 border-radius:11px;

 background:#f8f9fa;

 font:inherit;
}

button{
 width:100%;

 margin-top:20px;
 padding:13px;

 border:0;
 border-radius:11px;

 background:#15a46d;

 color:#fff;

 font-weight:800;
}

.errors,
.errorlist{
 color:#d84d4d;

 font-size:10px;
}

.login{
 margin-top:17px;

 color:#737b87;

 font-size:11px;
 text-align:center;
}

.login a{
 color:#15a46d;
 font-weight:750;
 text-decoration:none;
}
</style>

</head>

<body>


<form
 method="post"
 class="box"
>

{% csrf_token %}


<div class="logo">
 Stat<span>Play</span>
</div>


<p class="muted">
Crie sua conta para continuar
com a contratação do plano
selecionado.
</p>


{% if selected_plan %}

<input
 type="hidden"
 name="plan"
 value="{{ selected_plan }}"
>

{% endif %}


{{ form.as_p }}


<button type="submit">
 Criar conta
</button>


<div class="login">
 Já possui conta?
 <a href="/login/">
  Entrar
 </a>
</div>

</form>


</body>
</html>
